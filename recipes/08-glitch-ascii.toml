# The glitch look, but half of the damaged strips dissolve into text in the photo's own colours.
name = "glitch-ascii"
size = 1024

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 9
bands = 10
shift = 0.05
ascii_share = 0.5
ascii_cell = 11
seed = 4

[[step]]
effect = "grain"
amount = 0.07
size = 1.6
