# Hue-rotated teal scheme with glitch and text strips.
name = "teal-glitch-ascii"
size = 1024

[[step]]
effect = "hue_shift"
hue = 150

[[step]]
effect = "grade"
contrast = 1.12
saturation = 1.15

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 9
bands = 10
shift = 0.05
ascii_share = 0.5
ascii_cell = 11
seed = 7

[[step]]
effect = "grain"
amount = 0.06
size = 1.4
