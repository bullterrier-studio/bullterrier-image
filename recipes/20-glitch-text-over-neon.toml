# Text-over-photo glitch strips plus the subtle neon cast.
name = "glitch-text-over-neon"
size = 1024

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 9
bands = 10
shift = 0.05
ascii_share = 0.4
ascii_cell = 9
ascii_photo = 1.0
seed = 4

[[step]]
effect = "split_tone"
shadow = "#3a1bff"
highlight = "#ff2bd6"
amount = 0.4

[[step]]
effect = "glow"
radius = 20
strength = 0.25
threshold = 0.6
