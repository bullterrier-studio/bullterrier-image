# Mono print dots, then glitch with a little text: black-and-white, graphic.
name = "halftone-glitch"
size = 1024

[[step]]
effect = "halftone"
cell = 10
angle = 45
fg = "#ffffff"

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 6
bands = 9
shift = 0.06
ascii_share = 0.3
ascii_cell = 11
seed = 21
