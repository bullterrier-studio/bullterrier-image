# Glitch where some strips get text laid OVER the photo, so their detail stays visible.
name = "glitch-text-over"
size = 1024

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 9
bands = 10
shift = 0.05
ascii_share = 0.4
ascii_cell = 9
ascii_photo = 1.0
seed = 4

[[step]]
effect = "grain"
amount = 0.06
size = 1.6
