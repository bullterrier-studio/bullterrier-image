# Neon + glitch + text strips: the characters are drawn in the neon colours.
name = "neon-glitch-ascii"
size = 1024

[[step]]
effect = "gradient_map"
stops = ["#12002b", "#ff2bd6", "#00f0ff"]

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 11
bands = 10
shift = 0.05
ascii_share = 0.5
ascii_cell = 11
seed = 4

[[step]]
effect = "glow"
radius = 24
strength = 0.7
threshold = 0.45
