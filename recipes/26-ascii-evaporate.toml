# The ASCII portrait with the top of the head dissolving into rising, drifting, fading characters.
name = "ascii-evaporate"
size = 1600                   # the photo's own resolution: small letters need the pixels

[[step]]
effect = "grade"
saturation = 1.25            # keeps skin warm; brightness comes from the ascii step's gamma, not from exposure

[[step]]
effect = "clarity"
radius = 60
amount = 0.5

[[step]]
effect = "ascii"
cell = 4                     # small letters
chars = ' .`:,;-_~^!i+*Il1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$'   # 60 characters = many tonal steps
gamma = 0.6

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "evaporate"
cell = 4                     # same as the ascii step, so whole characters fly away
start = 0.4
end = 0.16
rise = 0.2
wind = 0.6
vanish = 0.35
seed = 3
