# Green-on-black terminal palette: the glitch strips become the "code".
name = "matrix-glitch-ascii"
size = 1024

[[step]]
effect = "gradient_map"
stops = ["#00110a", "#00c46a", "#c9ffe3"]

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 7
bands = 12
shift = 0.06
ascii_share = 0.6
ascii_cell = 10
seed = 11

[[step]]
effect = "glow"
radius = 20
strength = 0.5
threshold = 0.5
