# Head top stays solid; only the sides and shoulders dissolve, flying out sideways.
name = "evap-sides-only"
size = 1600

[[step]]
effect = "grade"
saturation = 1.25

[[step]]
effect = "clarity"
radius = 60
amount = 0.5

[[step]]
effect = "ascii"
cell = 5
chars = ' .`:,;-_~^!i+*Il1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$'
gamma = 0.6

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "evaporate"
cell = 5                     # same as the ascii step, so whole characters fly away
start = 0
outline = 0.12
outward = 0.8
rise = 0.22
wind = 0
vanish = 0.4
seed = 5
