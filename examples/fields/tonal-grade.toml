# A grade per tone: the picture's own brightness cut into three bands, the brightest first. The highlights go warm, the
# midtones stay as they are and the shadows go cool and a little lifted. Needs recipe format 3.
format = 3
name = "tonal-grade"
size = 1024

[region.tones]                 # band 0 is the brightest third of the brightness range, band 2 the darkest
kind = "bands"
of = "light"
count = 3

[[step]]
each = "tones"
name = "tones"
feather = 1.92                 # a soft border between the tones, so no hard contour shows
looks = [
    { effect = "grade", temperature = 0.8 },
    "none",
    { effect = "grade", temperature = -0.8 },
]

[[step]]
each = "tones"
feather = 1.92
looks = ["none", "none", { effect = "levels", output_black = 0.12 }]

[[step]]
effect = "sharpen"
preset = "clarity"
amount = 0.5
