# A fire palette, then torn glitch strips with a red and blue split.
name = "ember-glitch"
size = 1024

[[step]]
effect = "gradient_map"
stops = ["#0a0000", "#e0261b", "#ffb347", "#fff3d6"]

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "glitch"
split = 10
bands = 10
shift = 0.05
seed = 4

[[step]]
effect = "bloom"
radius = 22
amount = 0.55
threshold = 0.5
octaves = 1

[[step]]
effect = "grain"
amount = 0.05
size = 1.4
