# A fire palette, then torn glitch strips with a red and blue split.
name = "ember-glitch"
size = 1024

[[step]]
effect = "gradient_map"
stops = ["#0a0000", "#e0261b", "#ffb347", "#fff3d6"]

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 10
amount = 51.2
band_min_height = 10.24
band_max_height = 61.44
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 10
edge = "wrap"

[[step]]
effect = "bloom"
radius = 22
amount = 0.55
threshold = 0.5
octaves = 1

[[step]]
effect = "grain"
amount = 0.05
size = 1.4
