# A neon night street: magenta and violet grade, colour fringes, scanlines, a glow and rain. Would gain a CRT curve (batch 6) and neon edges (batch 8).
name = "cyberpunk"
size = 768

[[step]]
effect = "split_tone"
shadow = "#1b1464"
highlight = "#ff2bd6"
amount = 0.45

[[step]]
effect = "chromatic_aberration"
amount = 6

[[step]]
effect = "scanlines"
spacing = 3
darkness = 0.25

[[step]]
effect = "bloom"
radius = 24
amount = 0.6
threshold = 0.6

[[step]]
effect = "rain"
angle = 12
length = 40
opacity = 0.5
color = "#9fd8ff"
seed = 3

[[step]]
effect = "vignette"
amount = 0.5
