# The photo redrawn as text, every character in the colour of the photo underneath, over a faint ghost of the photo.
name = "ascii-colour"
size = 1024

[[step]]
effect = "grade"
saturation = 1.3

[[step]]
effect = "sharpen"
radius = 23.4375
amount = 0.5

[[step]]
effect = "ascii"
cell = 3
chars = ' .`:,;-_~^!i+*Il1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$'
gamma = 0.5
photo = 0.35               # a faint copy of the photo behind the letters: thin text alone tops out at ~27% brightness

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"
