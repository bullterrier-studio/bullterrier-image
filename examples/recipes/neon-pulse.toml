# Hot magenta and cyan on black, split into a faint chromatic fringe, with a glow that spills onto the dark.
name = "neon-pulse"
size = 1024

[[step]]
effect = "sharpen"          # bring out the fur and the face before the colours go on
radius = 18.75
amount = 0.6

[[step]]
effect = "gradient_map"
stops = ["#0a0020", "#6a1bff", "#ff2bd6", "#00f0ff"]

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"         # only the subject stays

[[step]]
effect = "rgb_split"
angle = 0
amount = 4.2188
edge = "wrap"

[[step]]
effect = "bloom"
radius = 13.125
amount = 0.8
threshold = 0.45
octaves = 1
