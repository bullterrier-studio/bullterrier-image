# The photo as a green phosphor terminal: characters on a curved CRT screen with a shadow mask, scanlines and glow.
name = "terminal"
size = 768

[[step]]
effect = "sharpen"
preset = "clarity"
amount = 0.8

[[step]]
effect = "ascii"
cell = 6
ink = "#4dff7c"
paper = "#00140a"
photo = 0.45
gamma = 0.6

[[step]]
effect = "crt"
curve = 0.12
shadow_mask = 0.25
scanlines = 0.25
bloom = 0.5
bloom_threshold = 0.55
vignette = 0.4
