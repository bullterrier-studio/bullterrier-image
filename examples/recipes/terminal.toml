# The photo as a green phosphor terminal: characters on a curved CRT screen with a shadow mask, scanlines and glow.
name = "terminal"
size = 768

[[step]]
effect = "sharpen"
preset = "clarity"
amount = 0.8

[[step]]
effect = "ascii"
cell = 6
ink = "#4dff7c"
paper = "#00140a"
photo = 0.45
gamma = 0.6

[[step]]
effect = "lens_distortion"
amount = 0.12
fit = "centre"
border = "#000000"

[[step]]
effect = "bloom"
octaves = 1
radius = 10
threshold = 0.55
amount = 0.5

[[step]]
effect = "scanlines"
spacing = 4
softness = 1
darkness = 0.25

[[step]]
effect = "pixel_grid"
cell = 3
gap = 0
amount = 0.25
keep_brightness = true

[[step]]
effect = "vignette"
amount = 0.4
radius = 0.2
feather = 1
