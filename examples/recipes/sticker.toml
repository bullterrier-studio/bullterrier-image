# A die-cut sticker: a white border round the subject, a soft shadow under it, on a sunset gradient.
name = "sticker"
size = 768

[[step]]
effect = "gradient"
kind = "linear"
colors = ["#ffd166", "#ef476f"]
angle = 60
mask = "background"

[[step]]
effect = "outline"
width = 8.75
color = "#ffffff"

[[step]]
effect = "drop_shadow"
offset = 11.7925           # hypot(10, 16)
angle = 57.994617            # atan2(16, 10)
blur = 11.25
opacity = 0.3                  # the shadow covers 30% of the gradient where it is full
