# The dog, drawn as text, just starting to evaporate. The whole outline hovers; the right side lets go first and a
# front sweeps right to left; every piece is blown right and up at 30 degrees through space already cleared.
name = "evaporate"
size = 1024

[[step]]
effect = "grade"
saturation = 1.3

[[step]]
effect = "clarity"
radius = 50
amount = 0.5

[[step]]
effect = "ascii"
cell = 6
chars = ' .`:,;-_~^!i+*Il1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$'
gamma = 0.5
photo = 0.35               # a faint copy of the photo behind the letters: thin text alone tops out at ~27% brightness

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "disperse"
cell = 6
progress = 0.25
ambient = 0.12
sweep = -1.0                # the front starts at the right edge...
top = 0
outline = 0
wind = 0.3                  # ...and every piece is blown right, at most 0.3 of the width,
angle = 30                  # up at 30 degrees,
hover = 0.25                # after the outline has floated a little first
seed = 4
