# The dog under a night sky: aurora curtains and stars behind, a cold tint on the fur, a rim of aurora light on the edge, a soft glow.
name = "northern-lights"
size = 768

[[step]]
effect = "aurora"
colors = ["#2bff9a", "#7a2cff"]
mask = "background"

[[step]]
