# A sunset gradient with a glowing grid screened over it behind a duotoned dog, split into colour ghosts.
name = "vaporwave"
size = 768

[[step]]
effect = "gradient"
kind = "linear"
colors = ["#ff71ce", "#b967ff", "#01cdfe"]
angle = 90
mask = "background"

[[step]]
effect = "pattern"
kind = "grid"
cell = 30
foreground = "#fffb96"
background = "#000000"            # black: screen leaves the gradient as it is between the lines
thickness = 0.1
mask = "background"
blend_mode = "screen"             # the lines lighten the gradient, as light does
opacity = 0.7

[[step]]
effect = "gradient_map"
stops = ["#3a0ca3", "#ff71ce", "#fffb96"]
mask = "subject"
opacity = 0.6

[[step]]
effect = "rgb_split"
angle = 0
amount = 3.75
