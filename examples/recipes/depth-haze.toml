# Aerial perspective: the room behind the dog mists over with a pale haze and loses contrast; what is near stays crisp.
# Needs recipe format 2 and the depth.
format = 2
name = "depth-haze"
size = 768

[region.far]                   # the back of the room, fading out toward the dog
kind = "depth"
near = 0.15
far = 0.0
feather = 0.15

[region.near]                  # the dog and the blanket
kind = "depth"
near = 1.0
far = 0.35
feather = 0.1

[[step]]
effect = "grade"
contrast = 0.75
saturation = 0.6
mask = "far"

[[step]]
effect = "fill"
color = "#dde5ee"
mask = "far"
opacity = 0.5

[[step]]
effect = "clarity"
radius = 20
amount = 0.4
mask = "near"
