# Aerial perspective: the room behind the dog mists over with a pale haze and loses contrast; what is near stays crisp.
# Needs recipe format 3 and the depth.
format = 3
name = "depth-haze"
size = 768

[region.far]                   # the back of the room, fading out toward the dog
kind = "band"
of = "depth"                   # the depth map, 1 = nearest
low = 0.0
high = 0.15
feather = 0.15

[region.near]                  # the dog and the blanket
kind = "band"
of = "depth"
low = 0.35
high = 1.0
feather = 0.1

[[step]]
effect = "grade"
contrast = 0.75
saturation = 0.6
mask = "far"

[[step]]
effect = "gradient"
colors = ["#dde5ee"]
mask = "far"
opacity = 0.5

[[step]]
effect = "sharpen"
radius = 12.5
amount = 0.4
mask = "near"
