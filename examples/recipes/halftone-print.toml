# A newsprint dot screen: tone becomes dot size, in warm white ink on black.
name = "halftone-print"
size = 1024

[[step]]
effect = "sharpen"
radius = 18.75
amount = 0.5

[[step]]
effect = "halftone"
cell = 5
angle = 45
ink = "#fff1de"

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"
