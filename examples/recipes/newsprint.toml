# A newspaper clipping: a four-colour (CMYK) dot print on off-white paper with a torn edge. Would gain a faded sepia (the sepia preset of gradient_map).
name = "newsprint"
size = 768

[[step]]
effect = "sharpen"
preset = "clarity"
amount = 0.5

[[step]]
effect = "levels"
gamma = 1.2

[[step]]
effect = "halftone"
cell = 3
angle = 0
separation = "cmyk"
paper = "#f2ead8"

[[step]]
effect = "paper_texture"
amount = 0.1

[[step]]
effect = "torn_edge"
width = 11.25
roughness = 0.4
fill = "#e9e2d0"
seed = 2
