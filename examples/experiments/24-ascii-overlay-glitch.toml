# Text-over-photo face, then the glitch slides and splits it, then a hint of neon.
name = "ascii-overlay-glitch"
size = 1024

[[step]]
effect = "ascii"
cell = 3
photo = 0.85
gamma = 0.8

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 8
amount = 24.0
band_min_height = 4.8
band_max_height = 28.8
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 4.2188
edge = "wrap"

[[step]]
effect = "color_balance"
shadows = "#3a1bff"
midtones = "#9d23eb"
highlights = "#ff2bd6"
amount = 0.35
