# Text over the photo with the subtle neon cast and a faint glow.
name = "ascii-overlay-neon"
size = 1024

[[step]]
effect = "ascii"
cell = 3
photo = 0.85
gamma = 0.8

[[step]]
effect = "color_balance"
shadows = "#3a1bff"
midtones = "#1d86ff"
highlights = "#00f0ff"
amount = 0.4

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "bloom"
radius = 8.4375
amount = 0.3
threshold = 0.6
octaves = 1
