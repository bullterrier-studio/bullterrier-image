# The halo look with bigger letters (6 px).
name = "evap-halo-big-letters"
size = 1600

[[step]]
effect = "grade"
saturation = 1.25

[[step]]
effect = "sharpen"
radius = 60
amount = 0.5

[[step]]
effect = "ascii"
cell = 6
chars = ' .`:,;-_~^!i+*Il1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$'
gamma = 0.6

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "disperse"
preset = "halo"
cell = 6                     # same as the ascii step, so whole characters fly away
