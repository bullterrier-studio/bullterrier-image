# The full neon palette, but only 30% of it, laid over the normal glitch.
name = "glitch-neon-blend"
size = 1024

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 8
amount = 24.0
band_min_height = 4.8
band_max_height = 28.8
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 4.2188
edge = "wrap"

[[step]]
effect = "gradient_map"
stops = ["#000000", "#ff2bd6", "#00f0ff"]
opacity = 0.3

[[step]]
effect = "grain"
amount = 0.06
size = 0.75
