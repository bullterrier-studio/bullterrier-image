# The normal glitch with a restrained neon cast: violet shadows, magenta highlights. Skin stays natural.
name = "glitch-subtle-neon"
size = 1024

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 8
amount = 0.05
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 9
edge = "wrap"

[[step]]
effect = "split_tone"
shadow = "#3a1bff"
highlight = "#ff2bd6"
amount = 0.4

[[step]]
effect = "bloom"
radius = 20
amount = 0.25
threshold = 0.6
octaves = 1

[[step]]
effect = "grain"
amount = 0.06
size = 1.6
