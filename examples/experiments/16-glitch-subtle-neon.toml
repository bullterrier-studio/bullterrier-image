# The normal glitch with a restrained neon cast: violet shadows, magenta highlights. Skin stays natural.
name = "glitch-subtle-neon"
size = 1024

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 8
amount = 24.0
band_min_height = 4.8
band_max_height = 28.8
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 4.2188
edge = "wrap"

[[step]]
effect = "color_balance"
shadows = "#3a1bff"
midtones = "#9d23eb"
highlights = "#ff2bd6"
amount = 0.4

[[step]]
effect = "bloom"
radius = 9.375
amount = 0.25
threshold = 0.6
octaves = 1

[[step]]
effect = "grain"
amount = 0.06
size = 0.75
