# Neon colour scheme, then glitch: the red/blue split fringes in the neon colours; glow spills onto the black.
name = "neon-glitch"
size = 1024

[[step]]
effect = "gradient_map"
stops = ["#12002b", "#ff2bd6", "#00f0ff"]

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 8
amount = 51.2
band_min_height = 10.24
band_max_height = 61.44
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 12
edge = "wrap"

[[step]]
effect = "bloom"
radius = 26
amount = 0.65
threshold = 0.5
octaves = 1
