# Mono print dots, then glitch: black-and-white, graphic.
name = "halftone-glitch"
size = 1024

[[step]]
effect = "halftone"
cell = 10
angle = 45
ink = "#ffffff"

[[step]]
effect = "fill"
color = "#000000"
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 9
amount = 0.06
seed = 21

[[step]]
effect = "rgb_split"
angle = 0
amount = 6
edge = "wrap"
