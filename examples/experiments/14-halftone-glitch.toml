# Mono print dots, then glitch: black-and-white, graphic.
name = "halftone-glitch"
size = 1024

[[step]]
effect = "halftone"
cell = 5
angle = 45
ink = "#ffffff"

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 9
amount = 28.8
band_min_height = 4.8
band_max_height = 28.8
seed = 21

[[step]]
effect = "rgb_split"
angle = 0
amount = 2.8125
edge = "wrap"
