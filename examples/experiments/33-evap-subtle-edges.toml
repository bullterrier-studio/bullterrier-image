# Gentle: the crown and the very edge of the outline fray.
name = "evap-subtle-edges"
size = 1600

[[step]]
effect = "grade"
saturation = 1.25

[[step]]
effect = "sharpen"
radius = 18
amount = 0.5

[[step]]
effect = "ascii"
cell = 1
chars = ' .`:,;-_~^!i+*Il1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$'
gamma = 0.6

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "disperse"
preset = "halo"
cell = 1                     # same as the ascii step, so whole characters fly away
reach = 0.4
outward = 0.35
seed = 2
