# Text portrait where every character keeps the colour of the photo underneath.
name = "ascii-photo"
size = 1024

[[step]]
effect = "grade"
exposure = 0.3
contrast = 1.1

[[step]]
effect = "sharpen"
radius = 60
amount = 0.6

[[step]]
effect = "ascii"
cell = 5
chars = " .:-=+*#%@"
gamma = 0.85

[[step]]
effect = "fill"
color = "#000000"
mask = "background"
