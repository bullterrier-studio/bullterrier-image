# Same idea, flipped: magenta in the shadows, cyan in the highlights.
name = "glitch-subtle-cyan-magenta"
size = 1024

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"

[[step]]
effect = "slice_shift"
preset = "glitch"
bands = 8
amount = 24.0
band_min_height = 4.8
band_max_height = 28.8
seed = 4

[[step]]
effect = "rgb_split"
angle = 0
amount = 4.2188
edge = "wrap"

[[step]]
effect = "color_balance"
shadows = "#ff2bd6"
midtones = "#808eeb"
highlights = "#00f0ff"
amount = 0.35

[[step]]
effect = "grain"
amount = 0.06
size = 0.75
