# The photo as a green phosphor terminal: characters, scanlines and glow. Would gain a CRT curve and flicker (batch 6).
name = "terminal"
size = 768

[[step]]
effect = "clarity"
amount = 0.8

[[step]]
effect = "ascii"
cell = 6
ink = "#4dff7c"
paper = "#00140a"
photo = 0.45
gamma = 0.6

[[step]]
effect = "scanlines"
spacing = 3
darkness = 0.2

[[step]]
effect = "bloom"
radius = 10
amount = 0.6
threshold = 0.55

[[step]]
effect = "vignette"
amount = 0.5
