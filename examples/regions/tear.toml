# The picture torn along a ragged line: one side a cyanotype, the other as it was, and a solid dark band along the tear.
# The tear is the cut bent by noise (`edge`), the band a plain line, no generated texture. Needs recipe format 2.
format = 2
name = "tear"
size = 1024

[region.tear]
kind = "cuts"
lines = [{ x = 0.6, y = 0.5, angle = 276 }]
edge = { style = "torn", amount = 4.8, scale = 57.6, seed = 2 }   # bends the cut by about 5 px, in slow wanders

[[step]]
each = "tear"
looks = ["none", { effect = "gradient_map", preset = "cyanotype" }]

[[step]]
effect = "seams"
partition = "tear"
width = 5.625
color = "#111111"
