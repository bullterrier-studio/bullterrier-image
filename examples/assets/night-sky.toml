# Makes examples/assets/night-sky.jpg from a flat grey picture of the photo's shape (see examples/README.md): green and
# violet aurora curtains over a field of stars, the second picture of the double-exposure look.
name = "night-sky"
size = 768

[[step]]
effect = "aurora"
colors = ["#2bff9a", "#7a2cff"]
height = 210                      # explicit: the defaults (336, 40, 200, 10 px) as they came out at 768, so this
waviness = 25                     # recipe still makes the committed night-sky.jpg
scale = 125
ray_width = 6.25

[[step]]
effect = "gradient"
colors = ["#04060f"]
opacity = 0.6

[[step]]
effect = "particles"
preset = "starfield"
density = 4.864
size = 1.875                      # the starfield preset's 3 px, as at 768
opacity = 0.6
