# A low light from the left, cast on the depth's shapes: the dog's left side lit, its right side in shade. Then the
# photo's own brightness read as a fine relief under the same light.
name = "relight"
size = 480

[[step]]
effect = "relight"
field = "depth"
angle = 180
elevation = 35
height = 250
opacity = 0.8

[[step]]
effect = "relight"
field = "light"
angle = 180
elevation = 35
height = 8
blur = 1
