# Turn the pink cushion toward orange and deepen it, then turn the background round the colour wheel.
name = "selective_color"
size = 480

[[step]]
effect = "selective_color"
hue = 340
width = 50
feather = 30
hue_shift = 40
saturation = 1.3
lightness = -0.1

# The whole room turned round the colour wheel; the dog stays.
[[step]]
effect = "selective_color"
preset = "hue_shift"
mask = "background"
