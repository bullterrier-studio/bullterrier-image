# The `solarize` preset blended in at 60%: the highlights fold back to dark. Then a warm S-curve: red up and blue down in
# the midtones.
name = "curves"
size = 480

[[step]]
effect = "curves"
preset = "solarize"
opacity = 0.6

[[step]]
effect = "curves"
shadows = 0.2
highlights = 0.8
red_midtones = 0.55
blue_midtones = 0.45
