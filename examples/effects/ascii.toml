# The photo redrawn as text, every character in the photo's own colour, over a faint ghost of the photo.
name = "ascii"
size = 480

[[step]]
effect = "ascii"
cell = 6
gamma = 0.5
photo = 0.35                  # thin text alone is dark; a faint copy of the photo behind it keeps it readable

[[step]]
effect = "fill"
color = "#000000"
mask = "background"           # the subject on black
