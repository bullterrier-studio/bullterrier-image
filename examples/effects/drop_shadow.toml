# The subject on a pale backdrop: a long fading shadow, and five paper-like layers stacked over it, behind the subject.
name = "drop_shadow"
size = 480

[[step]]
effect = "gradient"
colors = ["#f3ead8"]
mask = "background"           # a plain backdrop, so the copies show

[[step]]
effect = "drop_shadow"
preset = "long_shadow"        # 150 copies of the silhouette, one colour, fading out
color = "#3b1f6b"
end_color = "#3b1f6b"
opacity = 0.4                 # the shadow covers 40% of the backdrop where it is full

[[step]]
effect = "drop_shadow"
copies = 5                    # a stack of layers, from orange to purple
offset = 15
angle = 45
blur = 0
color = "#ff8a5b"
end_color = "#3b1f6b"
opacity = 1.0                 # the layers are opaque paper
