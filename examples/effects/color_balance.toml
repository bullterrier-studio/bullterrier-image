# Teal shadows and orange highlights behind the dog, blue-violet shadows and pink highlights on the dog.
name = "color_balance"
size = 480

[[step]]
effect = "color_balance"
preset = "teal_orange"
mask = "background"

[[step]]
effect = "color_balance"
shadows = "#3a1bff"
midtones = "#9d23eb"
highlights = "#ff2bd6"
amount = 0.3
mask = "subject"
