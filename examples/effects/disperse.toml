# One moment of the dispersal, part-way through: the right side is blowing away up and to the right.
name = "disperse"
size = 480

[[step]]
effect = "ascii"
cell = 6
gamma = 0.5
photo = 0.35

[[step]]
effect = "gradient"
colors = ["#000000"]
mask = "background"           # the subject on black

[[step]]
effect = "disperse"
cell = 6                      # same as the ascii step: whole characters move
progress = 0.3
sweep = -1.0
top = 0
outline = 0
wind = 144                    # px at size 480: at most 0.3 of the width
angle = 330                   # clockwise from right: 30 degrees above level
hover = 0.25
seed = 4
