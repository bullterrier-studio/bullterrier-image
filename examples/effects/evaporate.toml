# The top and the outline shed characters that drift up and away, like smoke.
name = "evaporate"
size = 480

[[step]]
effect = "ascii"
cell = 6
gamma = 0.5
photo = 0.35

[[step]]
effect = "fill"
color = "#000000"
mask = "background"           # the subject on black

[[step]]
effect = "evaporate"
cell = 6                      # same as the ascii step: whole characters move
start = 0.3
end = 0.08
outline = 0.06
outward = 0.5
rise = 0.2
vanish = 0.3
seed = 3
