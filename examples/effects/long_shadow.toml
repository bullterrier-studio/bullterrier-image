# The subject on a flat yellow backdrop, casting a long shadow to the lower right that fades out.
name = "long_shadow"
size = 480

[[step]]
effect = "fill"
color = "#ffd166"
mask = "background"           # a flat backdrop, as in flat design

[[step]]
effect = "long_shadow"
angle = 40
length = 220
color = "#e07a1f"
opacity = 0.9
fade = 1.0
