# A worn tape: tracking bands slide, the rows waver, colour bleeds to the right and the picture is grainy; then the
# failing-signal look (static, white dropouts) on its own copy, laid over at half opacity.
name = "vhs"
size = 480

[[step]]
effect = "vhs"
tracking = 0.08
seed = 4

[[step]]
effect = "vhs"
preset = "signal_noise"
opacity = 0.5
seed = 2
