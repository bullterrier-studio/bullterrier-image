# The signature looks: one photo x several combined recipes -> output/looks/
#
#   uv run photo-fx run examples/looks.toml
#
# Each look combines three or more effects; see the README ("Signature looks").
photos  = ["photos/*.jpeg", "photos/*.jpg", "photos/*.png"]
recipes = ["looks"]
output  = "output/looks"

[export]
formats = ["jpg"]
quality = 90
