# Named palettes of `dither`: one `[name]` table each, with a one-sentence `description` and `colors`, in the order their
# authors publish them (the order only matters to `block_group`). The name is the `palette` choice, so `palette = "ega"`.
# Adding a table adds a choice: the build writes `dither`'s `Palette` variants from this file. A palette that is a
# formula (`cube2` to `cube6`) is in the code. Colours are as published (sRGB).

[gameboy]
description = "The 4 greens widely used to draw a Game Boy screen (a community palette; the real panel's colours depend on the display)."
colors = ["#0f380f", "#306230", "#8bac0f", "#9bbc0f"]

[cga]
description = "IBM CGA graphics mode 4, palette 1, high intensity: black, cyan, magenta, white."
colors = ["#000000", "#55ffff", "#ff55ff", "#ffffff"]

[ega]
description = "The 16 default colours of the IBM EGA (and VGA text mode)."
colors = [
    "#000000", "#0000aa", "#00aa00", "#00aaaa", "#aa0000", "#aa00aa", "#aa5500", "#aaaaaa",
    "#555555", "#5555ff", "#55ff55", "#55ffff", "#ff5555", "#ff55ff", "#ffff55", "#ffffff",
]

[pico8]
description = "The 16 colours of the PICO-8 fantasy console."
colors = [
    "#000000", "#1d2b53", "#7e2553", "#008751", "#ab5236", "#5f574f", "#c2c3c7", "#fff1e8",
    "#ff004d", "#ffa300", "#ffec27", "#00e436", "#29adff", "#83769c", "#ff77a8", "#ffccaa",
]

# The ZX Spectrum's 8 colours at normal level 0xD7 and at bright level 0xFF, as in the Wikipedia article "ZX Spectrum
# graphic modes" (colour table). Black is listed in both runs (it is the same colour), so `block_group` 8 keeps a block's two
# colours inside one brightness: ink and paper of a cell share one BRIGHT bit.
[zx_spectrum]
description = "The ZX Spectrum's 15 colours: 8 at normal brightness, then 8 bright (black twice, so runs of 8 are the BRIGHT sets)."
colors = [
    "#000000", "#0000d7", "#d70000", "#d700d7", "#00d700", "#00d7d7", "#d7d700", "#d7d7d7",
    "#000000", "#0000ff", "#ff0000", "#ff00ff", "#00ff00", "#00ffff", "#ffff00", "#ffffff",
]

# The TMS9918A's 15 colours (colour 0 is transparent) as the widely circulated RGB set that emulators and palette
# collections use; no source is official, the chip's output being analogue.
[msx]
description = "The MSX (TMS9918A) 15 colours."
colors = [
    "#000000", "#3eb849", "#74d07d", "#5955e0", "#8076f1", "#b95e51", "#65dbef", "#db6559",
    "#ff897d", "#ccc35e", "#ded087", "#3aa241", "#b766b5", "#cccccc", "#ffffff",
]

# "Pepto" (Philip Timmermann, 2001): the 16 VIC-II colours as measured from a PAL machine (pepto.de/projects/colorvic).
[c64]
description = "The Commodore 64's 16 colours, as measured from a PAL machine (Pepto)."
colors = [
    "#000000", "#ffffff", "#68372b", "#70a4b2", "#6f3d86", "#588d43", "#352879", "#b8c76f",
    "#6f4f25", "#433900", "#9a6759", "#444444", "#6c6c6c", "#9ad284", "#6c5eb5", "#959595",
]

[windows16]
description = "The 16 colours of the Windows default palette: the EGA's hues at half and full level."
colors = [
    "#000000", "#800000", "#008000", "#808000", "#000080", "#800080", "#008080", "#c0c0c0",
    "#808080", "#ff0000", "#00ff00", "#ffff00", "#0000ff", "#ff00ff", "#00ffff", "#ffffff",
]

[teletext]
description = "The 8 colours of teletext: black, the three primaries, their mixes, and white."
colors = ["#000000", "#ff0000", "#00ff00", "#ffff00", "#0000ff", "#ff00ff", "#00ffff", "#ffffff"]

[grey4]
