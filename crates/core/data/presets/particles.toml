# Looks that are one particles step. They leave the step's opacity to the recipe: usual: embers 0.9, dust 0.55, rain 0.7, snow 0.8, stars 1.

[embers]
description = "Glowing orange sparks rising and drifting right, each trailing a short streak down and to the left."
density = 1.465
size = 7
length = 8
angle = 105
softness = 1
color = "#ff8a2b"

[floating_dust]
description = "Faint warm specks of light of several sizes, near ones large and soft, as out-of-focus dust in a sunbeam."
density = 0.977
size = 24
softness = 0.8
color = "#fff1d6"

[rain]
description = "Thin pale streaks falling a little to the right, near ones long and bright, far ones short and faint."
density = 1.0
size = 1.5
length = 32
angle = 80
softness = 0
color = "#dbe6f5"

[snow]
description = "Soft white flakes in four depth layers, the near ones large, blurry and bright, the far ones small and fainter."
density = 0.5
size = 14
softness = 0.5
color = "#ffffff"
layers = 4
size_falloff = 1

[starfield]
description = "Small crisp stars of several sizes and brightnesses. Put a dark one-colour `gradient` step before it for a night sky."
density = 7.324
size = 3
softness = 0
color = "#dfe8ff"
size_falloff = 0.7
brightness_falloff = 0.7
