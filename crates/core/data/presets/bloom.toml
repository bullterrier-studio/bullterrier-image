# Looks that are one bloom.

[soft_focus]
description = "Orton soft focus: a blurred copy of the whole picture, half-strength, screened over the sharp one."
radius = 12
threshold = 0
octaves = 1
amount = 0.5

[halation]
description = "Film halation: a red-orange glow around the brightest highlights, from light bouncing back through the film base."
radius = 30
threshold = 0.5
amount = 1.8
octaves = 1
color = "#ff4a14"

[glow]
description = "A glow: the bright parts blurred into one soft halo and screened over the sharp picture."
radius = 24
threshold = 0.55
amount = 0.6
octaves = 1
