# Looks that are one drop_shadow step.

[long_shadow]
description = "The flat-design long shadow: 150 copies 2 px apart, one colour, fading out over 300 px. Shows on light backgrounds; set color for dark ones."
copies = 150
offset = 2.0
angle = 45.0
blur = 0.0
copy_opacity = 0.16
fade = 1.0

[layered_cutouts]
description = "Cut-paper layers (set `opacity` 1): four opaque copies of the silhouette stacked behind the subject, from orange to purple."
copies = 4
offset = 14.0
angle = 45.0
blur = 0.0
color = "#ff8a5b"
end_color = "#3b1f6b"

[lamp_shadow]
description = "The shadow of a lamp at the upper left, long and soft: the copies step away from it, the farther from the lamp the more."
source = "point"
x = 0.15
y = 0.15
copies = 1
offset = 140.0
blur = 14.0
