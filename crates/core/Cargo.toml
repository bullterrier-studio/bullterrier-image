[package]
name = "bullterrier-image"
description = "The numeric core of bullterrier-image: its effects and the primitives they share, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Running models through ONNX Runtime (`finding::onnx`): the library is loaded at run time, none is bundled. The published wheel enables it.
onnx = ["dep:ort", "dep:sha2", "dep:ureq"]

[dependencies]
bullterrier-image-derive.workspace = true
delaunator.workspace = true
glob.workspace = true
image.workspace = true
libm.workspace = true
moxcms.workspace = true
ort = { workspace = true, optional = true }
read-fonts.workspace = true
rayon.workspace = true
roxmltree.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
svgtypes.workspace = true
tiff.workspace = true
toml.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
peak_alloc.workspace = true
proptest.workspace = true

[lints]
workspace = true

# the effect files are compiled in by the build script's generated `mod` declarations, which cargo-shear cannot see
[package.metadata.cargo-shear]
ignored-paths = ["src/effects/*.rs"]
