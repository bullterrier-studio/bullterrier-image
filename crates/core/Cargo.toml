[package]
name = "bullterrier-image"
description = "The numeric core of bullterrier-image: its effects and the primitives they share, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["image", "photo", "effects", "filters", "recipes"]
categories = ["multimedia::images", "graphics"]
readme = "README.md"
include = ["src/**", "data/**", "build.rs", "README.md", "LICENSE"]
publish = true  # one of the two crates published to crates.io (the others are implementation crates of the wheel)

[features]
# Running models through ONNX Runtime (`finding::onnx`): the library is loaded at run time, none is bundled. The published wheel enables it.
onnx = ["dep:ort", "dep:ureq", "dep:flate2", "dep:tar", "dep:zip"]

[dependencies]
bullterrier-image-derive.workspace = true
delaunator.workspace = true
flate2 = { workspace = true, optional = true }
glob.workspace = true
image.workspace = true
libm.workspace = true
moxcms.workspace = true
ort = { workspace = true, optional = true }
read-fonts.workspace = true
rayon.workspace = true
roxmltree.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
ureq = { workspace = true, optional = true }
svgtypes.workspace = true
tar = { workspace = true, optional = true }
tiff.workspace = true
toml.workspace = true
zip = { workspace = true, optional = true }
zune-core.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
peak_alloc.workspace = true
proptest.workspace = true

# the identity of the core: a hash of its sources, computed at build time (`build.rs`)
[build-dependencies]
sha2.workspace = true
toml.workspace = true

[lints]
workspace = true

# the effect files are compiled in by the build script's generated `mod` declarations, which cargo-shear cannot see
[package.metadata.cargo-shear]
ignored-paths = ["src/effects/*.rs"]
