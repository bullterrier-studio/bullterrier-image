[package]
name = "bullterrier-image"
description = "The numeric core of bullterrier-image: its effects and the primitives they share, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# the effect files are compiled in by the build script's generated `mod` declarations, which cargo-shear cannot see
[package.metadata.cargo-shear]
ignored-paths = ["src/effects/*.rs"]
