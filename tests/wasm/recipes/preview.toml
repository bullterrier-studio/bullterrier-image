# The recipe of the browser demo: a graded photo as a rotated halftone print with grain. Its three sliders are
# `step[0].contrast`, `step[1].cell` and `step[2].amount`.
name = "preview"
description = "A graded photo as a halftone print with grain."

[[step]]
effect = "grade"
contrast = 1.2

[[step]]
effect = "halftone"
cell = 6
angle = 30
separation = "spot"
inks = ["#e8325a", "#1f4fd8"]
paper = "#f4efe4"

[[step]]
effect = "grain"
amount = 0.05
seed = 1
