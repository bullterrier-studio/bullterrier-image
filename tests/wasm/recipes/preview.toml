# The recipe of the browser demo: a graded photo as a halftone of its own colours, with grain. The demo's sliders are
# `grade.contrast`, `halftone.cell` and `grain.amount`.
name = "preview"
description = "A graded photo as a halftone of its own colours, with grain."

[[step]]
effect = "grade"
contrast = 1.3

[[step]]
effect = "halftone"
cell = 3
angle = 30

[[step]]
effect = "grain"
amount = 0.05
seed = 1
