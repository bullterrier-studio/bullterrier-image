# Looks that are one channel mix.

[infrared]
description = "False-colour infrared: green is read as red, so foliage and bright greens turn pink and pale."
red_from_red = 0.2
red_from_green = 1.0
green_from_red = 0.6
green_from_green = 0.0
green_from_blue = 0.4
blue_from_blue = 0.2
blue_from_green = 0.8

[black_and_white]
description = "Black and white by Rec. 709 luma: every channel is the picture's brightness. Set the rows to your own shares (summing to 1) for a colour filter."
red_from_red = 0.2126
red_from_green = 0.7152
red_from_blue = 0.0722
green_from_red = 0.2126
green_from_green = 0.7152
green_from_blue = 0.0722
blue_from_red = 0.2126
blue_from_green = 0.7152
blue_from_blue = 0.0722
