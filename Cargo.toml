# The Rust core of bullterrier-image: `crates/core` (pure Rust: ops and effects; the crate `bullterrier-image`),
# `crates/derive` (the derive macros an effect declares its parameters with) and `crates/python` (the bindings that
# build `bullterrier_image._native._core`; maturin builds it, see [tool.maturin] in pyproject.toml). Rust settings
# live here, except what a tool cannot read from this file: rust-toolchain.toml, rustfmt.toml, deny.toml.
[workspace]
resolver = "3"
members = ["crates/core", "crates/derive", "crates/python"]

[workspace.package]
version = "0.0.0"  # never published on its own: the Python package's version (pyproject.toml) is the release's
edition = "2024"
rust-version = "1.99.1"  # the toolchain rust-toolchain.toml pins
license = "MIT"
repository = "https://github.com/bullterrier-studio/bullterrier-image"
publish = false

[workspace.dependencies]
bullterrier-image = { path = "crates/core" }
bullterrier-image-derive = { path = "crates/derive" }
# the files the core reads: pure-Rust decoders only (no C, no nasm); no encoders besides the ones these formats bring
delaunator = { version = "=1.1.0", default-features = false }  # Delaunay triangulation, a hard algorithm; used only in `ops/triangles.rs`
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
libm = "0.2"  # erfc, for the normal distribution function (`ops/gauss.rs`): pure Rust, MIT, no C
moxcms = { version = "0.8", default-features = false, features = ["lut"] }  # the colour profiles of image files, to sRGB (`lut` for the CMYK ones; the `image` crate brings it too, with its default features, so its SIMD paths are on)
numpy = "0.30"
peak_alloc = "0.3"
proc-macro2 = "1"
proptest = "1.12"
rayon = "1"  # the threads of a render (`Options::with_threads`)
# abi3-py312: one wheel per platform serves every Python from 3.12 (the oldest the package supports)
pyo3 = { version = "0.30", features = ["abi3-py312"] }
quote = "1"
roxmltree = { version = "0.21", default-features = false, features = ["std"] }  # the svg region reads a file
rustfft = "6.4"  # the Fourier transform: blurs and convolutions with a wide kernel cost the same at any width (`ops/fft.rs`)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # a recipe file's order is data (regions, first offender)
serde_path_to_error = "0.1"
svgtypes = { version = "0.16", default-features = false, features = ["std"] }  # path data, for the path regions
syn = "3"
tiff = { version = "0.11", default-features = false }  # the `image` crate's own TIFF decoder (its features are on there), read directly for 32-bit levels
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "preserve_order"] }
zune-core = { version = "0.5", default-features = false }  # with zune-jpeg: the inks of a CMYK JPEG, which `image` mixes to RGB
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

# Warnings, not errors, so a newer compiler's new lint never breaks a user's install; the gate (`poe check`) runs clippy
# and rustdoc with `-D warnings`, so every one fails it.
[workspace.lints.rust]
missing_docs = "warn"  # ruff's D1xx: every public item is documented
unreachable_pub = "warn"  # `pub` only where a crate's users reach it; inside a crate, `pub(crate)`
unsafe_code = "deny"  # the core forbids it outright (`#![forbid(unsafe_code)]`); the bindings deny it too

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# restriction picks: no panicking shortcut (an error is returned), no printing (the library never prints)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

# Debug builds keep file and line tables (panics and backtraces still name them) but no variable information, and on
# macOS the debug info stays in the binary: by default (`unpacked`) cargo leaves every object file of every build behind
# in target/debug/deps, never cleaned (1.1 million files, 38 GB after a week, measured). `cargo test` uses the
# `test` profile, which inherits this one.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

# The Rust tests render pictures: unoptimised, the 1090 tests of the `it` binary took 408 s (one test of 376 s); at 1 they
# take 8 s, the rebuild after touching one effect is no slower and the target folder smaller (measured; 2 gains little
# more and rebuilds slower). Overflow checks and debug assertions stay on.
[profile.test]
opt-level = 1

# The tools the gate runs that rustup does not install, each at the version the gate expects. `uv run poe setup`
# installs them; `tools/rust_tools.py` reads this table, the one place their versions are written.
[workspace.metadata.tools]
cargo-shear = "1.14.0"
cargo-deny = "0.20.2"
