# cargo-about: the third-party Rust crates the wheel is built from and the licences they come under (THIRD-PARTY-NOTICES.md,
# `uv run python tools/notices.py`). The accepted licences are the ones deny.toml allows.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
ignore-transitive-dependencies = false
workarounds = []
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# this project's own crates (publish = false) are not third-party
[private]
ignore = true
