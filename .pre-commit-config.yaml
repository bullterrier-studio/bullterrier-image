# Hook wiring only. Every tool setting (ruff rules, line length, pytest options, commit-message limits) lives in
# pyproject.toml, and the tools run through `uv run` so the versions are the ones pinned in uv.lock.
# Install once per clone with `uv run poe setup`; run everything by hand with `uv run poe check`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# the checks below are about staged files; only the two hooks that say otherwise run at the other stages
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000] # the committed gallery pictures reach about 400 KB
      - id: detect-private-key

  - repo: local
    hooks:
      # Hooks only check; they never rewrite staged files. The hook name is what pre-commit prints on a failure,
      # so it carries the fix. `types: [python]` leaves out the generated src/photo_fx/fx.pyi.
      - id: ruff-format
        name: ruff-format (fix with `uv run poe fix`)
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff-check (fix with `uv run poe fix`)
        entry: uv run ruff check
        language: system
        types: [python]
      - id: commit-message
        name: commit-message (Conventional Commits, see CLAUDE.md)
        entry: uv run python tools/check_commit_message.py
        language: system
        stages: [commit-msg]
      # The whole suite runs on push (and in `uv run poe check`), not on every commit.
      - id: tests
        name: tests (reproduce with `uv run poe test`)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
