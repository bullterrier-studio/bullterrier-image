# The static gates of `poe check`, each its own step so a failure names its tool, plus the workflow linters.
# Called by ci.yml; can also be started by hand.
name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Format, lint, dead code, dependencies, types, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked vulture
      - run: uv run --locked deptry .
      - run: uv run --locked mypy
      - run: uv run --locked poe lint-workflows
