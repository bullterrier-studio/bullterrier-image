# This project's own CI jobs: ci.yml runs this file beside the template's checks, the build waits for it, and so does ci-ok.
# The file is the project's: an update never changes it.
name: Project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The Rust tests `poe check` leaves out (`#[ignore = "full: ..."]`): every row of the matrices, which `check` runs one row of.
  # Once, on Linux, on every push to main and pull request that changes code (ci.yml); `poe full` runs them before a tag.
  rust-full-tier:
    name: The whole Rust test matrices pass
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the locked crates (cargo fetch)
        run: cargo fetch --locked
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      # the real-model tests (finding_onnx.rs) need the ONNX Runtime library, which `bt-image install onnx --runtime-only` keeps in the cache
      # folder (kept between runs with the models: the key is the files that hold their checksums, so a changed pin fetches again)
      - name: Keep the models between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bt-image
          key: models-${{ hashFiles('crates/core/src/finding.rs', 'crates/core/src/finding/runtime.rs') }}
      - name: Install the ONNX Runtime library
        run: uv run --locked bt-image install onnx --runtime-only --yes
      # a cold cache downloads each model once (about 280 MB), and the checksum in the catalogue guards what arrives
      - name: The whole matrices and the real models (poe rust-test-full)
        env:
          BT_IMAGE_ALLOW_DOWNLOAD: "1"
        run: uv run --locked poe rust-test-full

  # `poe new-effect` end to end, with a project environment of its own (out of `poe test`): once, on Linux
  scaffold:
    name: A scaffolded effect passes its tests after a rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the locked crates (cargo fetch)
        run: cargo fetch --locked
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      - name: Scaffold an effect, rebuild, run its tests (poe check-scaffold)
        run: uv run --locked poe check-scaffold

  # The project's own gates `poe check` ends with: what `regenerate` writes (fx.pyi, docs/effects/) and what cargo-about writes
  # (THIRD-PARTY-NOTICES.md) are fresh. Once, on Linux.
  generated:
    name: The generated files are fresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the locked crates (cargo fetch)
        run: cargo fetch --locked
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.3
      - name: fx.pyi and docs/effects are what regenerate writes
        run: uv run --locked python tools/dev.py check-generated
      - name: THIRD-PARTY-NOTICES.md is what cargo-about writes
        run: uv run --locked python tools/notices.py
