# The test suite and the import contracts on every supported operating system and Python.
# Called by ci.yml; can also be started by hand.
name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # one red platform must not hide the state of the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      # Windows runners check text files out with CRLF line endings; the suite expects the files as committed
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # the text effects draw with the first monospaced system font found (DejaVu Sans Mono on Linux)
      - name: Install a monospaced font
        if: runner.os == 'Linux'
        run: >-
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core)
      - run: uv sync --locked
      - run: uv run --locked poe test
      - run: uv run --locked lint-imports
