[project]
name = "bullterrier-image"
version = "0.1.0"
description = "Style photos with composable effects (ASCII, halftone, glitch, colour schemes, dispersing particles)."
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "LICENSE-FONT"]
authors = [
    { name = "jcakstins", email = "janis.cakstins@gmail.com" }
]
# 3.12 is the oldest version the code needs (PEP 695 generics are its newest syntax); the suite is green on 3.12, 3.13
# and 3.14. 3.15 is not listed until onnxruntime has wheels for it.
requires-python = ">=3.12"
keywords = ["photo", "image effects", "ascii art", "glitch", "halftone", "background removal", "recipe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
# Lower bounds are the oldest releases the suite passes with on Python 3.12 (`uv run poe check-min-deps` runs it against
# exactly these). Below them: Pillow 10.1.0 writes different JPEG bytes for the same pixels and Pillow 11.0.0 cannot
# build the geotagged picture of the metadata test, pydantic 2.7.0 fails at import, pyobjc 9.2 cannot read Vision's
# pixel buffer, scipy before 1.16 warns on every `affine_transform` with a 1-D matrix (the radial effects use it, and the
# suite turns warnings into errors), and numpy 1.26 and onnxruntime 1.17 are the first series with Python 3.12 wheels.
# No upper bounds: nothing is known to break on a newer release.
dependencies = [
    "annotated-types>=0.4.0",
    "numpy>=1.26.4",
    # the portable subject finder. No release has Python 3.15 wheels yet: there bullterrier-image installs without it, and the
    # portable backend says onnxruntime is missing (Apple Vision and --map subject=FILE still work)
    "onnxruntime>=1.17.0 ; python_version < '3.15'",
    "pillow>=11.1.0",
    "pydantic>=2.7.1",
    "pyobjc-framework-quartz>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=10.0 ; sys_platform == 'darwin'",
    "scipy>=1.16.0",
    "svgelements>=1.9.6",
]

[project.urls]
Repository = "https://github.com/bullterrier-studio/bullterrier-image"
Issues = "https://github.com/bullterrier-studio/bullterrier-image/issues"

[project.scripts]
bt-image = "bullterrier_image.cli:main"

# Effect packages: the registry imports every module of this group on its first query
# (bullterrier_image.core.registry). Our own effects come in the way a third party's do; an editable install
# (`uv sync`) provides this entry point too.
[project.entry-points."bullterrier_image.effects"]
bullterrier_image = "bullterrier_image.effects"

# maturin builds the Rust extension `bullterrier_image._native._core` (crates/python) and packs it with the Python code of src/
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "src"
module-name = "bullterrier_image._native._core"
# the files `poe new-effect` copies are for a source checkout, not part of the installed library
exclude = [{ path = "src/bullterrier_image/effects/_template/**", format = "wheel" }]
# a build from the sdist under rustup uses the toolchain CI tests and the wheels are built with
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

# `uv sync` and `uv run` rebuild the extension when one of these changes (by default uv looks at pyproject.toml only)
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/core/build.rs" },
]

# Read by `check-wheel-contents` in `poe build-check`: the wheel holds exactly src/bullterrier_image minus these, so a shipped
# template, picture or test fails (W102), and so does library code left out of the wheel (W101).
[tool.check-wheel-contents]
package = "src/bullterrier_image"
package_omit = ["__pycache__", "*.pyc", ".*", "_template", "*.jpg", "*.jpeg", "*.png", "*.gif", "test_*.py"]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "check-wheel-contents>=0.6.3",
    "deptry>=0.25.1",
    "git-cliff>=2.14.2",
    "hypothesis>=6.170.8",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "onnx>=1.23.2",
    "packaging>=26.3",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "twine>=7.0.0",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.16",
    "zizmor>=1.31.1",
]

# One command for agents and humans: `uv run poe check` before every push, `uv run poe fix` when it complains.
[tool.poe.tasks]
# PYTHONWARNDEFAULTENCODING makes the interpreter, and every xdist worker it starts, report text IO without an
# encoding (EncodingWarning), which `filterwarnings` below turns into a failure; an -X flag would not reach the workers
test = { cmd = "pytest -q -n auto", env = { PYTHONWARNDEFAULTENCODING = "1" }, help = "Run the test suite on every CPU core (pytest-xdist; the order stays random)" }
# Not part of `check`: the suite on the oldest Python and the lowest release each direct dependency's floor allows, in a
# throwaway environment (uv.lock and the project environment stay as they are; the first run downloads the old
# releases). It is for CI. tests/tools/test_lint_and_type_gate.py is left out because mypy's verdict on our source
# depends on numpy's own type annotations, which are not what this checks. No PYTHONWARNDEFAULTENCODING here: numpy 1.26
# runs a text-mode subprocess when numpy.testing is imported, and the encoding of our own IO is `poe test`'s concern.
check-min-deps = { cmd = "uv run --isolated --python 3.12 --resolution lowest-direct pytest -q -n auto --ignore=tests/tools/test_lint_and_type_gate.py", help = "Run the suite on Python 3.12 against the lowest allowed release of every dependency" }
# Not part of `check`: it asks the PyPI vulnerability database about every locked package (runtime, extras and dev
# tools, pinned by hash), so it needs the network and its verdict changes as advisories are published. For CI and
# before a release; an advisory with no fixed release is ignored with `--ignore-vuln ID` and listed in SECURITY.md.
# The Rust crates in Cargo.lock are checked by cargo-deny against the RustSec advisory database, likewise online.
audit = { sequence = ["uv export --frozen --all-extras --all-groups --no-emit-project --quiet --output-file dist/audit/requirements.txt", "pip-audit --requirement dist/audit/requirements.txt --disable-pip --require-hashes --progress-spinner off", "cargo deny --locked check advisories"], default_item_type = "cmd", help = "Check every locked dependency (Python and Rust) against known vulnerabilities (needs the network)" }
fix = { sequence = ["ruff check --fix .", "ruff format .", "cargo fmt --all"], default_item_type = "cmd", help = "Apply every automatic lint and format fix" }
# The sdist and wheel as PyPI would get them, built into dist/check (git-ignored, emptied first) and checked by twine
# (metadata, rendered README; the quoted glob is twine's to expand) and check-wheel-contents (stray or unimportable files)
build-check = { sequence = ["uv build --quiet --clear --no-create-gitignore --out-dir dist/check", "twine check --strict 'dist/check/*'", "check-wheel-contents dist/check"], default_item_type = "cmd", help = "Build the sdist and wheel and check what would be uploaded" }
# The GitHub workflows and dependabot.yml: actionlint (syntax, expressions, job wiring; it also runs shellcheck on the
# `run:` scripts when shellcheck is installed, as on GitHub's runners) and zizmor (unpinned actions, template
# injection, persisted credentials, over-broad permissions). `uv run`, because the actionlint-py distribution names
# its program differently. zizmor stays offline so the gate needs no network; its online audits need a GitHub token.
lint-workflows = { sequence = ["uv run actionlint", "zizmor --offline .github"], default_item_type = "cmd", help = "Lint the GitHub workflows (actionlint, zizmor)" }
# The Rust gates, each beside its Python counterpart; cargo comes with rustup, at the version rust-toolchain.toml pins.
# Warnings fail only here (`-D warnings`), never a user's build. tests/tools/test_rust_gates.py shows each one failing.
rust-fmt = { cmd = "cargo fmt --all --check", help = "Check the Rust formatting (rustfmt.toml)" }
rust-lint = { cmd = "cargo clippy --workspace --all-targets --locked --quiet -- -D warnings", help = "Lint the Rust code: clippy, dead code, missing docs, unreachable pub, unsafe ([workspace.lints] in Cargo.toml)" }
rust-doc = { cmd = "cargo doc --workspace --no-deps --locked --quiet", env = { RUSTDOCFLAGS = "-D warnings" }, help = "Build the Rust documentation; any rustdoc warning (a broken link) fails" }
rust-tools = { cmd = "uv run python tools/rust_tools.py check", help = "Check that the cargo tools the gate runs are installed at the versions Cargo.toml pins" }
rust-shear = { cmd = "cargo shear", help = "Find Rust dependencies no code uses (cargo-shear)" }
rust-deny = { cmd = "cargo deny --offline --locked check bans licenses sources", help = "Check the Rust dependencies offline: banned crates, licences, sources (deny.toml)" }
stubtest = { cmd = "uv run python -m mypy.stubtest --mypy-config-file pyproject.toml bullterrier_image._native._core", help = "Check the stub _core.pyi against the built extension" }
rust-test = { cmd = "cargo test --workspace --locked --quiet", help = "Run the Rust tests" }
# vulture over src, plus a whitelist of the parameter fields only the Rust core reads (tools/vulture_whitelist.py)
dead-code = { sequence = ["uv run python tools/vulture_whitelist.py dist/vulture/whitelist.py", "vulture src dist/vulture/whitelist.py"], default_item_type = "cmd", help = "Find dead code in src (vulture), the fields the Rust core reads excepted" }
check = { sequence = ["ruff format --check .", { ref = "rust-fmt" }, "ruff check .", { ref = "rust-lint" }, { ref = "lint-workflows" }, { ref = "dead-code" }, { ref = "rust-doc" }, "deptry .", { ref = "rust-tools" }, { ref = "rust-shear" }, { ref = "rust-deny" }, { ref = "build-check" }, "mypy", { ref = "stubtest" }, { ref = "rust-test" }, { ref = "test" }], default_item_type = "cmd", help = "The full gate, Python and Rust (format, lint, workflows, dead code, docs, dependencies, distributions, types, tests); stops at the first failure" }
# Developer commands that need a source checkout (tools/dev.py); extra arguments go to the script, e.g. `poe gallery --only grain`.
gallery = { cmd = "uv run python tools/dev.py gallery", help = "Render the missing gallery pictures and write the catalogue in docs/effects/ (--only NAME..., --force)" }
regenerate = { cmd = "uv run python tools/dev.py regenerate", help = "After adding or changing effects: write fx.pyi and the catalogue in docs/effects/, render missing pictures" }
new-effect = { cmd = "uv run python tools/dev.py new-effect", help = "Create a new effect's files from the template (NAME --category CATEGORY)" }
# Release from main in one command: checks, plan, [y/N], version bump, changelog section, commit, annotated tag and an
# atomic push of main and the tag (CONTRIBUTING.md, "Releasing")
release = { cmd = "uv run python tools/release.py", help = "Release VERSION from main (e.g. 0.1.0rc1 to TestPyPI, 0.1.0 to PyPI): check, plan, ask, bump, tag, push [--dry-run] [--yes]" }
# `default_install_hook_types` in .pre-commit-config.yaml names the three hook types, so a bare `install` covers them
setup = { sequence = ["pre-commit install --install-hooks", "git config --local commit.template .gitmessage", "uv run python tools/rust_tools.py install"], default_item_type = "cmd", help = "Install the git hooks, the commit-message template and the cargo tools the gate runs (once per clone)" }

# Read by tools/check_commit_message.py (the commit-msg hook): Conventional Commits 1.0 with these limits.
[tool.commit-message]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
header-max-length = 72
body-max-line-length = 100
scope-pattern = "^[a-z0-9][a-z0-9/_-]*$"

[tool.pytest.ini_options]
testpaths = ["tests"]
# test files are named after the module they test, so equal names in different folders must never collide
# a misspelt marker or option is an error, not a silently ignored typo
# with xdist (`-n`), tests marked `xdist_group` stay on one worker, so an expensive module fixture is built once
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "--dist=loadgroup"]
# an xfail that starts passing fails the run, so the marker cannot outlive the bug it names
xfail_strict = true
# Every warning fails the test that raised it: a leaked file or process (ResourceWarning), a deprecated call, and, when
# PYTHONWARNDEFAULTENCODING=1 is set (`poe test` sets it), text IO that relies on the locale's encoding (EncodingWarning,
# PEP 597). The ignores below are third-party code we cannot change, each matched by message, category and module.
filterwarnings = [
    "error",
    # Pillow's ImageFile.load opens the image file in text mode only to memory-map it; no text is read
    "ignore:'encoding' argument not specified:EncodingWarning:PIL.ImageFile",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/bullterrier_image/fx.pyi"]  # generated by `poe regenerate`
src = ["src", "tests"]

[tool.ruff.lint]
# Preview for the linter only (the formatter keeps its stable style), and only for the preview rules listed by code
# in `select` (PLC2701, PLW1514), never a whole preview family.
preview = true
explicit-preview-rules = true
# Opinionated enough to keep the code consistent, typed and documented; not so strict that it blocks progress.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PIE", "RET", "PERF", "RUF", "PT", "DTZ", "T20",
    "PLE", "PLW",
    "ANN",  # type hints on public functions
    # docstrings on every PUBLIC module, class, method, function and package (a leading _ exempts a name); none empty
    "D100", "D101", "D102", "D103", "D104", "D106", "D419",
    # security (flake8-bandit): shell commands, pickle, yaml.load, eval/exec, hard-coded secrets, unchecked URL schemes,
    # insecure temp files and hashes, assert in library code. A subprocess call (S603) carries a `# noqa` saying why
    # its argv is safe.
    "S",
    "SLF001",  # private-member access: applies to tests too, which must not reach into the implementation
    "PLC2701",  # import of a private name (a preview rule, turned on alone by explicit-preview-rules)
    # a `# type: ignore` names its error code and a `# noqa` its rule (RUF100, in RUF, fails an unused `# noqa`)
    "PGH",
    "LOG",  # logging misuse (the root logger, a logger made by hand), should anything here ever log
    "PLW1514",  # text files opened without `encoding=` use the locale's, which breaks non-ASCII names on Windows (preview)
    "BLE",  # `except Exception` hides bugs; catch what can happen, or say why everything must be caught
    "PTH",  # pathlib, not os.path / open() / glob: one way to handle paths
    "PYI",  # type stubs (the Rust extension's, `_core.pyi`) written as stubs: no bodies, no docstrings
]
# Deliberately NOT enabled: TRY003 / EM (message-style noise); the docstring style rules D2xx / D4xx beyond D419 (we
# enforce presence, not formatting); PLR2004 magic numbers and PLR0913 argument counts (numeric code and
# parameter-rich effects); FBT (boolean arguments); TID252 (relative imports are fine inside the package); PLC0415
# (lazy imports are deliberate for platform-specific code).
# Ignored: ANN202 (private-function return types are mypy's job), ANN401 (Any is sometimes right), RUF001-003
# (unicode in strings, docstrings and comments is wanted), PLW2901 (rebinding a loop variable is a clear idiom).
ignore = ["ANN202", "ANN401", "RUF001", "RUF002", "RUF003", "PLW2901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from annotations, docstrings, PLW, naming and assert-False; NOT from SLF001 / PLC2701, on purpose: a
# test must not reach into the implementation. Of bandit only these: assert is how pytest checks (S101), and a test
# runs our own interpreter and the developer's tools (python, git, uv) with argv it wrote itself (S603, S607).
"tests/**" = ["ANN", "D", "S101", "S603", "S607", "PLW", "N", "B011"]
"src/bullterrier_image/cli.py" = ["T20"]  # the CLI prints; add other presentation modules only with a reason
# scripts run by hand (the commit-message and config checks, the banner, the API example): printing is their output
"tools/**" = ["T20"]
"docs/*.py" = ["T20"]
"examples/*.py" = ["T20"]
"src/bullterrier_image/effects/**" = ["A001"]  # the `ascii` effect function shadows a builtin by design
"**/__init__.py" = ["F401"]

# Pyright is the language server behind editor and Claude Code navigation (pyright-lsp); mypy stays the type gate. It only
# needs to find the project's virtualenv and the source layout so that every import resolves. Config lives here, not in a
# pyrightconfig.json (tests/tools/test_one_config_home.py forbids that file).
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "src/bullterrier_image/fx.pyi"]  # fx.pyi is generated at integration, like mypy and ruff skip it
extraPaths = ["src"]

# `uv run mypy` checks src and tests; the gate (`poe check`) and the pre-push hook run it.
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# tests/ has no __init__.py (pytest imports it with importlib), so equal test file names in different folders need
# module names from their paths: tests/ops/test_color.py is tests.ops.test_color, src/bullterrier_image/x.py is bullterrier_image.x.
explicit_package_bases = true
mypy_path = "src"
# Generated at integration, so behind every branch by design (ruff skips it too). Without it mypy reads `fx.py`,
# whose `__getattr__` types each `fx.<effect>` as a step builder: an effect added on a branch type-checks at once.
exclude = ["src/bullterrier_image/fx\\.pyi$"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# NOT enabled: warn_return_any (scipy and parts of numpy return Any: pure noise here), disallow_any_generics (bare
# np.ndarray everywhere), full --strict.
# The pydantic plugin types each model's constructor from its fields, so a misspelt parameter name is a type error.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "svgelements", "Foundation", "Quartz", "Vision", "objc.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Dead code fails the gate (`uv run poe dead-code`, in `poe check` and the pre-push hook). Only src is scanned: code
# that only tests use is dead, unless a public `__all__` lists it. 60 % is vulture's lowest level: it reports unused functions,
# classes and attributes, not just unreachable lines. Each exemption below is a name or decorator that a framework calls.
[tool.vulture]
paths = ["src"]
min_confidence = 60
ignore_decorators = [
    "@effect",  # the registry finds an effect function through its decorator; recipes and `fx` call it by name
    "@model_validator",  # pydantic runs validators when a model is built
    "@field_validator",
]
ignore_names = [
    "StartDoctypeDeclHandler",  # expat calls the function assigned to each of these callback attributes
    "StartElementHandler",
    "EndElementHandler",
    "model_config",  # pydantic reads each model's settings from this class attribute
    "ignored_warning_kinds",  # pydantic reads it from a JSON schema generator class
    "__signature__",  # `inspect.signature` reads it (the documented way to give a callable a signature)
    "__call__",  # Python calls it when a registered effect object is called
    "__getattr__",  # module-level hooks (PEP 562): `fx.<effect>` and `dir(fx)`
    "__dir__",
    "writeable",  # numpy's array flag: setting it makes a shared, cached array read-only
    "blend",  # `Step.blend`: public API (README, `fx`), called by users' scripts and never inside the package
    "schema",  # `registry.schema`: an effect's parameters as JSON schema, for tools outside the package
    "unregister",  # `registry.unregister`: for tests that register throwaway effects (tests/conftest.py)
    "DISCOURAGED",  # the parameter vocabulary, read by the contract test over every registered effect
    "regenerate",  # `gallery.regenerate` and `new_effect`: run by tools/dev.py (`poe regenerate`, `poe new-effect`), which
    "new_effect",  # is a source-checkout script outside the scanned package
    "seconds",  # `pipeline.Item.seconds`: how long a pair took, written to manifest.json by `asdict`
]

# Every import is declared, and only once in the right place (`uv run deptry .`, in `poe check`): a missing, unused,
# transitive-only or development-only dependency fails. tests/ is not scanned (deptry's default): tests may use the
# development tools.
[tool.deptry]
# check_release: tools/release.py imports its sibling script (a script's own folder is first on sys.path)
known_first_party = ["bullterrier_image", "check_release"]
# pyobjc is not installed off macOS, so deptry cannot read which module each framework provides: say it
package_module_name_map = { "pyobjc-framework-quartz" = "Quartz", "pyobjc-framework-vision" = "Vision" }

[tool.deptry.per_rule_ignores]
# Foundation comes with pyobjc-framework-cocoa, which both declared pyobjc frameworks depend on (macOS only)
DEP001 = ["Foundation"]
DEP003 = ["Foundation"]
# packaging (PEP 440 versions) is used by tools/release.py, a developer command that runs in the dev environment
DEP004 = ["packaging"]

# The layering rules of CLAUDE.md, checked by `uv run lint-imports` (tests/test_layering.py runs it, and proves each
# contract fails on a forbidden import). Imports flow downward only. Wildcards keep the rules free of effect names, so
# adding an effect never edits this file.
[tool.importlinter]
root_package = "bullterrier_image"

[[tool.importlinter.contracts]]
name = "Layers: app > adapters > effects > core > ops > errors"
type = "layers"
containers = ["bullterrier_image"]
exhaustive = true  # a new top-level module must be placed in a layer here
# Each layer may import only the layers below it ("|" = independent siblings, ":" = siblings that may import each
# other). Being exhaustive, it also stops core, ops and errors importing anything above them.
layers = [
    "__main__",  # `python -m bullterrier_image`: runs the command line
    "cli",  # app, split so its modules cannot form cycles: recipe imports no other app module
    "pipeline | gallery",
    "sheet | checks | fx",
    "recipe",
    "imageio : finding : loader",  # adapters: file formats, finding the subject, recipe files (the loader reads pictures through imageio)
    "effects",
    "plugin",  # the effect-author API for other packages: core's names, so bullterrier-image's own effects may use it too
    "core",  # may import ops
    "ops",
    # the exceptions, and the home of the Rust extension (`_native._core`): they import nothing, so every layer may use
    # them
    "errors | _native",
]

[[tool.importlinter.contracts]]
name = "Effects never import each other"
type = "independence"
# Every effect folder in effects/. `_`-prefixed modules cannot be excluded by a wildcard, and none hold Python
# code: code that two effects share belongs in ops/.
modules = ["bullterrier_image.effects.*"]

[[tool.importlinter.contracts]]
name = "Core: runner > steps > framing|registry|regions > presets|looks|outlines > params|vocabulary > types"
type = "layers"
containers = ["bullterrier_image.core"]
exhaustive = true  # a new core module must be placed in a layer here
# registry registers effects by their parameter model (params); params shows a colour field in the forms a caller writes
# (types); the registry lists an effect's presets, which are read and checked with its parameter model, and names the
# looks it finds beside them; a recipe's
# framing is declared with the same parameter model and used by the steps' recipe; the region kinds are declared with it
# too, read their presets, and are built into regions the runner uses. Each edge points down, so each gets a layer of its
# own (the framing, the registry and the regions side by side: none knows another); nothing else changes.
layers = ["runner", "steps", "framing | registry | regions", "presets | looks | outlines", "params | vocabulary", "types"]

# Read by git-cliff when `uv run poe release` writes a release's section of CHANGELOG.md: the Conventional Commits since
# the last tag, grouped as Keep a Changelog does. A commit only appears if a parser below names its group; the rest
# (docs, test, style, ci, build, chore, refactor: work a user of the library does not see) is left out, except a
# breaking change, which always appears. The `<!-- n -->` prefixes put the groups in Keep a Changelog's order and are
# stripped from the headings.
[tool.git-cliff.changelog]
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]"
# a release lists every change since the previous release, not since its own pre-releases (v0.2.0rc1 ...)
ignore_tags = "^v[0-9]+\\.[0-9]+\\.[0-9]+(a|b|rc)[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^[a-z]+\\(security\\)", group = "<!-- 5 -->Security" },
    { message = "^(feat|fix|perf|refactor)(\\([^)]*\\))?!?: (remove|drop|delete) ", group = "<!-- 3 -->Removed" },
    { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^(perf|revert)", group = "<!-- 1 -->Changed" },
]

