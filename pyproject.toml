[project]
name = "photo-fx"
version = "0.1.0"
description = "Style photos with composable effects (ASCII, halftone, glitch, colour schemes, evaporating particles) and animate them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jcakstins", email = "janis.cakstins@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "scipy>=1.18.1",
]

[project.scripts]
photo-fx = "photo_fx.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

# One command for agents and humans: `uv run poe check` before every push, `uv run poe fix` when it complains.
[tool.poe.tasks]
test = { cmd = "pytest -q", help = "Run the test suite" }
fix = { sequence = ["ruff check --fix .", "ruff format ."], default_item_type = "cmd", help = "Apply every automatic lint and format fix" }
check = { sequence = ["ruff format --check .", "ruff check .", { ref = "test" }], default_item_type = "cmd", help = "The full gate; stops at the first failure" }
# `default_install_hook_types` in .pre-commit-config.yaml names the three hook types, so a bare `install` covers them
setup = { sequence = ["pre-commit install --install-hooks", "git config --local commit.template .gitmessage"], default_item_type = "cmd", help = "Install the git hooks and the commit-message template (once per clone)" }

# Read by tools/check_commit_message.py (the commit-msg hook): Conventional Commits 1.0 with these limits.
[tool.commit-message]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
header-max-length = 72
body-max-line-length = 100
scope-pattern = "^[a-z0-9][a-z0-9/_-]*$"

[tool.pytest.ini_options]
testpaths = ["tests"]
# test files are named after the module they test, so equal names in different folders must never collide
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/photo_fx/fx.pyi"]  # generated by `photo-fx regenerate`
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# The layering rules of CLAUDE.md, checked by `uv run lint-imports` (tests/test_layering.py runs it, and proves each
# contract fails on a forbidden import). Imports flow downward only. Wildcards keep the rules free of effect names, so
# adding an effect never edits this file.
[tool.importlinter]
root_package = "photo_fx"

[[tool.importlinter.contracts]]
name = "Layers: app > adapters > effects > core > ops"
type = "layers"
containers = ["photo_fx"]
exhaustive = true  # a new top-level module must be placed in a layer here
# Each layer may import only the layers below it ("|" = independent siblings, ":" = siblings that may import each
# other). Being exhaustive, it also stops core and ops importing anything above them.
layers = [
    "cli",  # app, split so its modules cannot form cycles: recipe imports no other app module
    "pipeline | gallery",
    "sheet | checks | fx",
    "recipe",
    "imageio : matte",  # adapters
    "effects",
    "core",  # may import ops
    "ops",
]

[[tool.importlinter.contracts]]
name = "ops imports nothing else from photo_fx"
type = "forbidden"
source_modules = ["photo_fx.ops"]
forbidden_modules = ["photo_fx.*"]  # every top-level module but ops itself (overlaps are skipped)

[[tool.importlinter.contracts]]
name = "Effects never import each other"
type = "independence"
# Every module (later: every folder) in effects/. `_`-prefixed modules cannot be excluded by a wildcard, and none
# exist: code that two effects share belongs in ops/.
modules = ["photo_fx.effects.*"]

[[tool.importlinter.contracts]]
name = "Core modules: loader | runner > steps > registry | timing | types | vocabulary"
type = "layers"
containers = ["photo_fx.core"]
exhaustive = true  # a new core module must be placed in a layer here
layers = ["loader | runner", "steps", "registry | timing | types | vocabulary"]

[[tool.importlinter.contracts]]
name = "loader imports only steps and timing from core"
type = "forbidden"
source_modules = ["photo_fx.core.loader"]
forbidden_modules = ["photo_fx.core.registry", "photo_fx.core.types", "photo_fx.core.vocabulary"]
allow_indirect_imports = true  # through steps is fine: the TOML reader itself only builds Steps and Recipes

[[tool.importlinter.contracts]]
name = "timing imports nothing else from photo_fx"
type = "forbidden"
source_modules = ["photo_fx.core.timing"]
forbidden_modules = ["photo_fx.*", "photo_fx.core.*"]  # overlaps (core itself, timing itself) are skipped
