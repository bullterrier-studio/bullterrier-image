[project]
name = "photo-fx"
version = "0.1.0"
description = "Style photos with composable effects (ASCII, halftone, glitch, colour schemes, evaporating particles) and animate them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jcakstins", email = "janis.cakstins@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["photo", "image effects", "ascii art", "glitch", "halftone", "background removal", "animation", "recipe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
dependencies = [
    "annotated-types>=0.8.0",
    "numpy>=2.5.4",
    # the portable subject finder; 1.23 is the last release with wheels for Intel Macs and macOS 13, so the floor
    # stays there and those machines get it too. No release has Python 3.15 wheels yet: there photo-fx installs
    # without it, and the portable backend says onnxruntime is missing (Apple Vision and --matte still work)
    "onnxruntime>=1.23.2 ; python_version < '3.15'",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "scipy>=1.18.1",
]

[project.urls]
Repository = "https://github.com/jcakstins/photo-fx"
Issues = "https://github.com/jcakstins/photo-fx/issues"

[project.scripts]
photo-fx = "photo_fx.cli:main"

[project.optional-dependencies]
# a static ffmpeg for macOS, Linux and Windows, used when no ffmpeg is on the PATH (only .mp4 / .mov need it)
video = [
    "imageio-ffmpeg>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the files `photo-fx new-effect` copies are for a source checkout, not part of the installed library
wheel-exclude = ["photo_fx/effects/_template"]

# Read by `check-wheel-contents` in `poe build-check`: the wheel holds exactly src/photo_fx minus these, so a shipped
# template, picture or test fails (W102), and so does library code left out of the wheel (W101).
[tool.check-wheel-contents]
package = "src/photo_fx"
package_omit = ["__pycache__", "*.pyc", ".*", "_template", "*.jpg", "*.jpeg", "*.png", "*.gif", "*.mp4", "test_*.py"]

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6.3",
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "onnx>=1.23.2",
    "photo-fx[video]",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "twine>=7.0.0",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.16",
]

# One command for agents and humans: `uv run poe check` before every push, `uv run poe fix` when it complains.
[tool.poe.tasks]
test = { cmd = "pytest -q", help = "Run the test suite" }
fix = { sequence = ["ruff check --fix .", "ruff format ."], default_item_type = "cmd", help = "Apply every automatic lint and format fix" }
# The sdist and wheel as PyPI would get them, built into dist/check (git-ignored, emptied first) and checked by twine
# (metadata, rendered README; the quoted glob is twine's to expand) and check-wheel-contents (stray or unimportable files)
build-check = { sequence = ["uv build --quiet --clear --no-create-gitignore --out-dir dist/check", "twine check --strict 'dist/check/*'", "check-wheel-contents dist/check"], default_item_type = "cmd", help = "Build the sdist and wheel and check what would be uploaded" }
check = { sequence = ["ruff format --check .", "ruff check .", "vulture", "deptry .", { ref = "build-check" }, "mypy", { ref = "test" }], default_item_type = "cmd", help = "The full gate (format, lint, dead code, dependencies, distributions, types, tests); stops at the first failure" }
# `default_install_hook_types` in .pre-commit-config.yaml names the three hook types, so a bare `install` covers them
setup = { sequence = ["pre-commit install --install-hooks", "git config --local commit.template .gitmessage"], default_item_type = "cmd", help = "Install the git hooks and the commit-message template (once per clone)" }

# Read by tools/check_commit_message.py (the commit-msg hook): Conventional Commits 1.0 with these limits.
[tool.commit-message]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
header-max-length = 72
body-max-line-length = 100
scope-pattern = "^[a-z0-9][a-z0-9/_-]*$"

[tool.pytest.ini_options]
testpaths = ["tests"]
# test files are named after the module they test, so equal names in different folders must never collide
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["src/photo_fx/fx.pyi"]  # generated by `photo-fx regenerate`
src = ["src", "tests"]

[tool.ruff.lint]
# Preview for the linter only (the formatter keeps its stable style), and only for the preview rules listed by code
# in `select` (PLC2701, PLW1514), never a whole preview family.
preview = true
explicit-preview-rules = true
# Opinionated enough to keep the code consistent, typed and documented; not so strict that it blocks progress.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PIE", "RET", "PERF", "RUF", "PT", "DTZ", "T20",
    "PLE", "PLW",
    "ANN",  # type hints on public functions
    # docstrings on every PUBLIC module, class, method, function and package (a leading _ exempts a name); none empty
    "D100", "D101", "D102", "D103", "D104", "D106", "D419",
    "S102", "S307",  # exec / eval
    "SLF001",  # private-member access: applies to tests too, which must not reach into the implementation
    "PLC2701",  # import of a private name (a preview rule, turned on alone by explicit-preview-rules)
    "PGH003",  # a `# type: ignore` must name its error code (RUF100, in RUF, fails an unused `# noqa`)
    "PLW1514",  # text files opened without `encoding=` use the locale's, which breaks non-ASCII names on Windows (preview)
    "BLE",  # `except Exception` hides bugs; catch what can happen, or say why everything must be caught
    "PTH",  # pathlib, not os.path / open() / glob: one way to handle paths
]
# Deliberately NOT enabled: TRY003 / EM (message-style noise); the docstring style rules D2xx / D4xx beyond D419 (we
# enforce presence, not formatting); PLR2004 magic numbers and PLR0913 argument counts (numeric code and
# parameter-rich effects); FBT (boolean arguments); TID252 (relative imports are fine inside the package); PLC0415
# (lazy imports are deliberate for platform-specific code).
# Ignored: ANN202 (private-function return types are mypy's job), ANN401 (Any is sometimes right), RUF001-003
# (unicode in strings, docstrings and comments is wanted), PLW2901 (rebinding a loop variable is a clear idiom).
ignore = ["ANN202", "ANN401", "RUF001", "RUF002", "RUF003", "PLW2901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from annotations, docstrings, bandit, PLW, naming and assert-False; NOT from SLF001 / PLC2701, on
# purpose: a test must not reach into the implementation.
"tests/**" = ["ANN", "D", "S", "PLW", "N", "B011"]
"src/photo_fx/cli.py" = ["T20"]  # the CLI prints; add other presentation modules only with a reason
# scripts run by hand (the commit-message and config checks, the banner, the API example): printing is their output
"tools/**" = ["T20"]
"docs/*.py" = ["T20"]
"examples/*.py" = ["T20"]
"src/photo_fx/effects/**" = ["A001"]  # the `ascii` effect function shadows a builtin by design
"**/__init__.py" = ["F401"]
# Known BLE and PTH findings, each to be fixed in its module and its line deleted (pipeline: a deliberate per-photo
# catch-all wants a reasoned noqa, glob of user patterns, open; loader: open)
"src/photo_fx/pipeline.py" = ["BLE001", "PTH123", "PTH207"]
"src/photo_fx/core/loader.py" = ["PTH123"]

# `uv run mypy` checks src and tests; the gate (`poe check`) and the pre-push hook run it.
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
# tests/ has no __init__.py (pytest imports it with importlib), so equal test file names in different folders need
# module names from their paths: tests/ops/test_color.py is tests.ops.test_color, src/photo_fx/x.py is photo_fx.x.
explicit_package_bases = true
mypy_path = "src"
# Generated at integration, so behind every branch by design (ruff skips it too). Without it mypy reads `fx.py`,
# whose `__getattr__` types each `fx.<effect>` as a step builder: an effect added on a branch type-checks at once.
exclude = ["src/photo_fx/fx\\.pyi$"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# NOT enabled: warn_return_any (scipy and parts of numpy return Any: pure noise here), disallow_any_generics (bare
# np.ndarray everywhere), full --strict.
# The pydantic plugin types each model's constructor from its fields, so a misspelt parameter name is a type error.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "Foundation", "Quartz", "Vision", "objc.*", "onnxruntime", "onnxruntime.*", "imageio_ffmpeg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Dead code fails the gate (`uv run vulture`, in `poe check` and the pre-push hook). Only src is scanned: code that only
# tests use is dead, unless a public `__all__` lists it. 60 % is vulture's lowest level: it reports unused functions,
# classes and attributes, not just unreachable lines. Each exemption below is a name or decorator that a framework calls.
[tool.vulture]
paths = ["src"]
min_confidence = 60
ignore_decorators = [
    "@effect",  # the registry finds an effect function through its decorator; recipes and `fx` call it by name
    "@model_validator",  # pydantic runs validators when a model is built
    "@field_validator",
]
ignore_names = [
    "model_config",  # pydantic reads each model's settings from this class attribute
    "__signature__",  # `inspect.signature` reads it (the documented way to give a callable a signature)
    "__call__",  # Python calls it when a registered effect object is called
    "__getattr__",  # module-level hooks (PEP 562): `fx.<effect>` and `dir(fx)`
    "__dir__",
    "writeable",  # numpy's array flag: setting it makes a shared, cached array read-only
    "blend",  # `Step.blend`: public API (README, `fx`), called by users' scripts and never inside the package
]

# Every import is declared, and only once in the right place (`uv run deptry .`, in `poe check`): a missing, unused,
# transitive-only or development-only dependency fails. tests/ is not scanned (deptry's default): tests may use the
# development tools.
[tool.deptry]
known_first_party = ["photo_fx"]
# pyobjc is not installed off macOS, so deptry cannot read which module each framework provides: say it
package_module_name_map = { "pyobjc-framework-quartz" = "Quartz", "pyobjc-framework-vision" = "Vision" }

[tool.deptry.per_rule_ignores]
# Foundation comes with pyobjc-framework-cocoa, which both declared pyobjc frameworks depend on (macOS only)
DEP001 = ["Foundation"]
DEP003 = ["Foundation"]

# The layering rules of CLAUDE.md, checked by `uv run lint-imports` (tests/test_layering.py runs it, and proves each
# contract fails on a forbidden import). Imports flow downward only. Wildcards keep the rules free of effect names, so
# adding an effect never edits this file.
[tool.importlinter]
root_package = "photo_fx"

[[tool.importlinter.contracts]]
name = "Layers: app > adapters > effects > core > ops"
type = "layers"
containers = ["photo_fx"]
exhaustive = true  # a new top-level module must be placed in a layer here
# Each layer may import only the layers below it ("|" = independent siblings, ":" = siblings that may import each
# other). Being exhaustive, it also stops core and ops importing anything above them.
layers = [
    "cli",  # app, split so its modules cannot form cycles: recipe imports no other app module
    "pipeline | gallery",
    "sheet | checks | fx",
    "recipe",
    "imageio : matte",  # adapters
    "effects",
    "core",  # may import ops
    "ops",
]

[[tool.importlinter.contracts]]
name = "ops imports nothing else from photo_fx"
type = "forbidden"
source_modules = ["photo_fx.ops"]
forbidden_modules = ["photo_fx.*"]  # every top-level module but ops itself (overlaps are skipped)

[[tool.importlinter.contracts]]
name = "Effects never import each other"
type = "independence"
# Every effect folder in effects/. `_`-prefixed modules cannot be excluded by a wildcard, and none hold Python
# code: code that two effects share belongs in ops/.
modules = ["photo_fx.effects.*"]

[[tool.importlinter.contracts]]
name = "Core order: loader | runner > steps > registry > params | timing > types"  # vocabulary sits with timing
type = "layers"
containers = ["photo_fx.core"]
exhaustive = true  # a new core module must be placed in a layer here
# registry registers effects by their parameter model (params); params shows a colour field in the forms a caller writes
# (types). Both edges point down, so each gets a layer of its own; nothing else changes.
layers = ["loader | runner", "steps", "registry", "params | timing | vocabulary", "types | errors"]

[[tool.importlinter.contracts]]
name = "loader imports only steps, timing and errors from core"
type = "forbidden"
source_modules = ["photo_fx.core.loader"]
forbidden_modules = ["photo_fx.core.registry", "photo_fx.core.types", "photo_fx.core.vocabulary"]
allow_indirect_imports = true  # through steps is fine: the TOML reader itself only builds Steps and Recipes

[[tool.importlinter.contracts]]
name = "timing imports nothing else from photo_fx"
type = "forbidden"
source_modules = ["photo_fx.core.timing"]
forbidden_modules = ["photo_fx.*", "photo_fx.core.*"]  # overlaps (core itself, timing itself) are skipped

# the dev group installs this project's own `video` extra (so the bundled-ffmpeg fallback is tested)
[tool.uv.sources]
photo-fx = { workspace = true }
