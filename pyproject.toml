[project]
name = "photo-fx"
version = "0.1.0"
description = "Style photos with composable effects (ASCII, halftone, glitch, colour schemes, evaporating particles) and animate them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jcakstins", email = "janis.cakstins@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "scipy>=1.18.1",
]

[project.scripts]
photo-fx = "photo_fx.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test files are named after the module they test, so equal names in different folders must never collide
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/photo_fx/fx.pyi"]  # generated by `photo-fx regenerate`
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
